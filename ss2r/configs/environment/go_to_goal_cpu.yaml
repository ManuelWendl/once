domain_name: mujoco_cpu

task_name: GoToGoalCPU
task_params:
  # Level 1 layout, as in go_to_goal_recovery.
  num_hazards: 8
  num_vases: 1
  goal_size: 0.3
  # Safe operable region R: slow and clear of all obstacles.
  recovery_distance: 0.5
  recovery_speed: 0.5
  # Almost stopped in R, as in go_to_goal_recovery.
  stop_speed: 0.2
  stop_angular_velocity: 1.5
  # The violation is the cost: a hazard or the vase touched, or the vase moved,
  # at any step of a control step; or leaving the arena. As in
  # go_to_goal_recovery, hard_distance is the distance below which the robot can
  # touch an obstacle, the violation of the learned model.
  violation_on_cost: true
  hard_distance: 0.3
  # Leaving the arena as a violation: no obstacle within this distance (the
  # observation has no absolute position). Off (null); 2.5 is almost never
  # reached inside of the arena and about 1.75 m beyond its edge.
  max_distance: null
  # Steering that follows the command, as in go_to_goal_recovery (see
  # go_to_goal.stabilize_steering).
  stable_steering: true
  # Thrust proportional to the command, as in go_to_goal_recovery (see
  # go_to_goal.linearize_thrust).
  linear_thrust: true

# Changes of the nominal model, playing the role of the sim-to-real gap.
# Damping and mass are scaled, the gears are offset.
real_params:
  damping:
    x: 1.
    y: 1.
    z: 1.
  gear:
    x: 0.
    z: 0.
  mass: 1.
