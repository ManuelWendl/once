# Level 1 layout (8 hazards, 1 vase). For level 2, override
# task_params.num_hazards=10 and task_params.num_vases=10.
defaults:
  - go_to_goal_easy

task_name: go_to_goal_recovery
task_params:
  # Distances are to the center of the closest obstacle. Hazards have a radius
  # of 0.2, the robot touches a vase from 0.3.
  # Safe operable region R: slow and clear of all obstacles. From 0.5 m/s the
  # robot brakes to a stop within 0.03, well inside of the buffer.
  recovery_distance: 0.5
  recovery_speed: 0.5
  # Hard constraint on the distance.
  hard_distance: 0.35
  # Leaving the arena as a violation: no obstacle within this distance (the
  # observation has no absolute position). 2.5 is almost never reached inside
  # of the arena and about 1.75 m beyond its edge.
  max_distance: 2.5
  # R requires an obstacle within this distance: a buffer of 0.3 to leaving the
  # arena, more than the 0.25 that the robot coasts from 0.5 m/s. On average,
  # 0.3% of the arena is farther from every obstacle (at most 8%).
  recovery_max_distance: 2.2
  # The nominal robot reaches 1.5 m/s and 3 rad/s.
  reset_speed: 1.5
  reset_angular_velocity: 3.0
  # Steering that follows the command (see go_to_goal.stabilize_steering).
  # Without it, small steering commands do not turn the robot.
  stable_steering: true
  # Thrust proportional to the command (see go_to_goal.linearize_thrust).
  # Without it, every command above 0.05 gives the full force.
  linear_thrust: true

# The horizon is a true terminal state (no bootstrapping).
terminate_on_timeout: true
# Sample a new initial state on every reset.
resample_resets: true
