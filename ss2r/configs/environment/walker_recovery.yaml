defaults:
  - mujoco_playground_base

task_name: WalkerRecovery
task_params:
  action_repeat: 1
  ctrl_dt: 0.025
  episode_length: 1000
  sim_dt: 0.0025
  vision: false
  # Safe operable region R: standing up straight, with the torso, the thighs
  # and the legs tilted by less than about 25 degrees, slowly rotating.
  recovery_upright: 0.9
  recovery_leg_upright: 0.9
  recovery_pitch_rate: 1.0
  # Hard constraint: the walker falls over when its torso tilts by more than 60
  # degrees.
  hard_upright: 0.5
  # Initial states, fitted to the states of walking (policies that learned to
  # walk without a filter, 0.5% to 99.5% quantiles with a small margin), such
  # that the recovery prior also learns to recover from walking, without the
  # long tails of the velocities. The torso tilt is narrower than all tilts that
  # did not fall, walking only needs about 0.35 rad.
  reset_pitch: 0.4
  reset_joint_range: 0.8
  # [low, high] of the hip, knee and ankle, for both legs. Walking slightly
  # exceeds the (soft) joint ranges of the model.
  reset_joint_angles: [[-0.5, 1.9], [-2.8, 0.2], [-1.05, 1.05]]
  reset_pitch_rate: 7.0
  # Walking is at 1.2 to 2.9 m/s, slower speeds stay for recovery and standing.
  reset_forward_velocity: [-0.5, 3.0]
  reset_vertical_velocity: 1.3
  reset_joint_velocity: 5.0
  reset_joint_velocities: [[-21.0, 19.0], [-21.0, 32.0], [-37.0, 33.0]]
  # A share of the starts near standing, the initial state of the task (in R):
  # without them, the prior never acts from standing and does not learn to keep
  # the walker up. Noise of [angles, velocities] around standing.
  reset_standing_share: 0.2
  reset_standing_noise: [0.05, 0.1]

# The horizon is a true terminal state (no bootstrapping).
terminate_on_timeout: true
# Sample a new initial state on every reset.
resample_resets: true

# Sample uniformly around the nominal value. The gear offsets are centered on
# the one of the real system (walker_walk_cpu.yaml, 10), narrower than in
# walker.yaml ([0, 20]) to keep the spread of the perturbed models small.
train_params:
  torso_length: [0.0, 0.0]
  friction: [0.0, 0.0]
  joint_damping: [0.0, 0.0]
  gear: [5., 15.]

eval_params:
  torso_length: [0.0, 0.0]
  friction: [0.0, 0.0]
  joint_damping: [0.0, 0.0]
  gear: [5., 15.]
