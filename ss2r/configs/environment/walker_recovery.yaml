defaults:
  - mujoco_playground_base

task_name: WalkerRecovery
task_params:
  action_repeat: 1
  ctrl_dt: 0.025
  episode_length: 1000
  sim_dt: 0.0025
  vision: false
  # Safe operable region R: standing up straight, with the torso, the thighs
  # and the legs tilted by less than about 25 degrees, slowly rotating.
  recovery_upright: 0.9
  recovery_leg_upright: 0.9
  recovery_pitch_rate: 1.0
  # Hard constraint: the walker falls over when its torso tilts by more than 60
  # degrees.
  hard_upright: 0.5
  # Initial states, fitted to the states of walking (policies that learned to
  # walk without a filter, 0.1% to 99.9% quantiles with a margin), such that the
  # recovery prior also learns to recover from walking. The torso tilt is
  # narrower than all tilts that did not fall, walking only needs about 0.4 rad.
  reset_pitch: 0.5
  reset_joint_range: 0.8
  # [low, high] of the hip, knee and ankle, for both legs. Walking slightly
  # exceeds the (soft) joint ranges of the model.
  reset_joint_angles: [[-0.55, 1.95], [-2.85, 0.35], [-1.15, 1.15]]
  reset_pitch_rate: 9.0
  # Walking is at 1 to 3 m/s, slower speeds stay for recovery and standing.
  reset_forward_velocity: [-0.5, 3.5]
  reset_vertical_velocity: 1.8
  reset_joint_velocity: 5.0
  reset_joint_velocities: [[-27.0, 27.0], [-28.0, 41.0], [-48.0, 48.0]]

# The horizon is a true terminal state (no bootstrapping).
terminate_on_timeout: true
# Sample a new initial state on every reset.
resample_resets: true

# Sample uniformly around the nominal value. The gear offsets are centered on
# the one of the real system (walker_walk_cpu.yaml, 10), narrower than in
# walker.yaml ([0, 20]) to keep the spread of the perturbed models small.
train_params:
  torso_length: [0.0, 0.0]
  friction: [0.0, 0.0]
  joint_damping: [0.0, 0.0]
  gear: [5., 15.]

eval_params:
  torso_length: [0.0, 0.0]
  friction: [0.0, 0.0]
  joint_damping: [0.0, 0.0]
  gear: [5., 15.]
