# @package _global_
# Recovery prior trained against a handover adversary (ss2r/algorithms/sac/adversary.py),
# as cyberrunner_recovery_prior_adversary: in half the episodes an adversary sends the
# actions for 1 to 10 control steps (up to 0.8 s) to make the robot violate the
# constraint, then the backup takes over. Both learn from all transitions, the backup's
# critic always continuing with the backup, and they are updated in turns (RARL).
defaults:
  - go_to_goal_recovery_prior
  - _self_

training:
  # Horizon H = episode_length / action_repeat = 70 control steps (5.6 s), twice the
  # 35 of go_to_goal_recovery_prior. A timeout ends an episode as a failure and the
  # critic does not see the time left, so Q_R stays below 1 even for a robot standing
  # in R: about 0.8 with 35 steps (gtg_prior_adversary), such that a threshold of 0.85
  # blocks every action, and 0.90 to 0.96 with 70 (gtg_prior_stop_h70), checked with
  # plotting/probe_gtg_prior.py. ONCE needs agent.recovery_horizon: 70 with it.
  episode_length: 280
  # The 15M of gtg_prior_stop_h70, doubled: the backup is updated in half of the
  # blocks only.
  num_timesteps: 30000000

environment:
  task_params:
    adversary_fraction: 0.5
    # 0.8 s, 14% of the horizon: the adversary's phase counts towards the horizon
    # of the backup.
    adversary_max_steps: 10

agent:
  adversary:
    # Blocks of this many environment steps (action_repeat counted), the backup's
    # first: each is updated in its own blocks only. With 128 envs and 8 updates per
    # control step, a block is about 3100 updates, as in CyberRunner.
    alternate_every_steps: 200000
    learning_rate: 0.0003
    critic_learning_rate: 0.0003
    alpha_learning_rate: 0.0003
    init_alpha: 1.0
    tau: 0.005
    hidden_layer_sizes: [256, 256, 256]
    activation: swish
