# @package _global_
defaults:
  - override /agent: once
  - override /environment: cyberrunner_cpu
  - _self_

# The recovery prior is trained with cyberrunner_recovery_prior_adversary (or
# cyberrunner_recovery_prior) and loaded with prior.checkpoint_path. Its R is
# set in environment/cyberrunner_recovery.yaml and has to match environment/cyberrunner_cpu.yaml.
prior:
  experiment: cyberrunner_recovery_prior_adversary

training:
  # An environment step takes 1/60 seconds: 500000 steps are about 2.3 hours.
  num_timesteps: 500000
  action_repeat: 1
  # The rewards, to count the goals afterwards.
  store_trajectory: true

agent:
  # The prior sees the 30 history values, not the path points.
  recovery_observation_size: 30
  recovery_threshold: 0.95
  # Q_R stays at the prior's: fine-tuned online, it collapses within 22k steps, as the
  # learned model is wrong about the backup's actions.
  recovery_q_learning_rate: 0
  # Horizon of cyberrunner_recovery_prior: 100 steps at 60 Hz.
  recovery_horizon: 100
  recovery_restart_rollouts: true
  min_replay_size: 5000
  num_critic_updates_per_actor_update: 2
  # The only setting with which the shielded ball reaches the goal on all seeds.
  pessimistic_q: false
  # The task reward is scaled in the environment (reward_scale)
  reward_scaling: 1
  # Keeps alpha high enough to look for new lines past the holes.
  target_entropy: 0
  # The worst progress reward per step is about -0.8 after the environment's scale of 10
  # (the ball rolling back at 0.5 m/s); The intervention should cost more.
  intervention_task_reward: -1
  # Over 9 seeds, optimism 1 with discount 0.995 parks the ball for the least time
  # (median 31 min in 500k steps against 56).
  optimism: 1
  optimism_schedule:
    # agent.optimism_schedule.name=info_gain turns it on.
    name: null
    # The newest frame's measurements: joint angles (rad) and ball (m), whose noise is
    # uniform within +-0.25 deg and +-1 mm: std = half width / sqrt(3).
    dims: [24, 25, 26, 27]
    noise_std: [0.00252, 0.00252, 0.000577, 0.000577]
    # beta_0 = R sqrt(2 (1 + ln 10)) = 1, the constant optimism above.
    R: 0.389
    # 20 times the constant optimism: at the disagreement floor (0.003) the bonus is
    # then about 0.06 per step, around the progress reward of slow rolling. To be set
    # from utility_scripts/cyberrunner_parking.py --info-gain.
    max: 20
  discounting: 0.995
  margin: 0.02
  # Over 9 seeds, a smaller critic than once.yaml's [512, 512] reaches the goal more often
  # (median 36 goals in 500k steps against 4) and parks the ball less.
  value_hidden_layer_sizes: [256, 256]
