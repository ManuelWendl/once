# @package _global_
defaults:
  - mujoco_playground_dm_control
  - override /environment: go_to_goal_recovery
  - override /agent/propagation: spidr
  - override /agent/reward_robustness: pessimistic_recovery
  - _self_

training:
  num_timesteps: 5000000
  action_repeat: 4
  # Recovery horizon H = episode_length / action_repeat = 25 steps (2 seconds).
  episode_length: 100
  safe: false
  train_domain_randomization: true
  eval_domain_randomization: true
  render: false

agent:
  activation: swish
  # Finite horizon, no discounting.
  discounting: 1.0
  propagation:
    num_envs: 8
    # With stable_steering, the disagreement (lambda_ = 1) comes from the
    # randomized gears: 0 when coasting, 0.032 when braking straight (thrust),
    # 0.009 to 0.031 when steering from 0.3 to 1, 0.046 (p90 0.058) for random
    # actions. Before, the chattering steering made it 0.06 when coasting and
    # up to 0.3 when steering.
    lambda_: 0.2
    alpha: 0.
    statistic: std
  reward_robustness:
    penalty_scale: 1.0
    # Slightly above the disagreement of coasting and braking straight:
    # 0.035 * lambda_. Braking and steering alone are not penalized, combined
    # thrust and steering slightly.
    margin: 0.007
