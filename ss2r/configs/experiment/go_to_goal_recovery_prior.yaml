# @package _global_
defaults:
  - mujoco_playground_dm_control
  - override /environment: go_to_goal_recovery
  - override /agent/propagation: spidr
  - override /agent/reward_robustness: pessimistic_recovery
  - _self_

training:
  num_timesteps: 5000000
  action_repeat: 4
  # Recovery horizon H = episode_length / action_repeat = 25 steps (2 seconds).
  episode_length: 100
  safe: false
  train_domain_randomization: true
  eval_domain_randomization: true
  render: false

agent:
  activation: swish
  # Finite horizon, no discounting.
  discounting: 1.0
  propagation:
    num_envs: 8
    # The disagreement is dominated by the accelerometer and the gyro, which
    # differ between the perturbed models at every step (about 0.06 to 0.08
    # with lambda_ = 1, up to 0.35 when steering).
    lambda_: 0.2
    alpha: 0.
    statistic: std
  reward_robustness:
    penalty_scale: 1.0
    # Slightly above the disagreement of coasting and braking straight.
    margin: 0.01
