# @package _global_
defaults:
  - mujoco_playground_dm_control
  - override /environment: go_to_goal_recovery
  - override /agent/propagation: spidr
  - override /agent/reward_robustness: pessimistic_recovery
  - _self_

training:
  num_timesteps: 5000000
  action_repeat: 4
  # Recovery horizon H = episode_length / action_repeat = 35 steps (2.8 s): 25
  # to reach R, as before recovery_dwell, and 10 to stay in R.
  episode_length: 140
  safe: false
  train_domain_randomization: true
  eval_domain_randomization: true
  render: false

agent:
  activation: swish
  # Finite horizon, no discounting.
  discounting: 1.0
  # The filter rates the actions of the behavior, followed by the prior. Half
  # of the episodes start with a uniformly random action, and 10% of the later
  # actions are random, such that Q_R also learns actions unlike the prior's.
  # The other half start with the prior's own action, which trains it to stay
  # in R from the starts inside of R.
  random_first_action_prob: 0.5
  random_action_prob: 0.1
  propagation:
    num_envs: 8
    # With stable_steering and linear_thrust, the disagreement (lambda_ = 1)
    # comes from the randomized gears: 0 when coasting, up to 0.032 when
    # braking straight (median 0.001, at full thrust 0.032), 0.009 to 0.031
    # when steering from 0.3 to 1, 0.031 (p90 0.048) for random actions.
    # Before, the chattering steering made it 0.06 when coasting and up to 0.3
    # when steering.
    lambda_: 0.2
    alpha: 0.
    statistic: std
  reward_robustness:
    penalty_scale: 1.0
    # Slightly above the disagreement of coasting and braking straight:
    # 0.035 * lambda_. Braking and steering alone are not penalized, combined
    # thrust and steering above average slightly.
    margin: 0.007
