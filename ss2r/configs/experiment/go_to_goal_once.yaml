# @package _global_
defaults:
  - override /agent: once
  - override /environment: go_to_goal_cpu
  - _self_

prior:
  experiment: go_to_goal_recovery_prior
  # Priors have to be trained with the robot and R of go_to_goal_recovery:
  # fbhat9kt predates stable_steering, the priors of gtg_once_stable (e.g.
  # hdstt6hw) predate linear_thrust and recovery_max_distance, the priors of
  # gtg_prior_far and gtg_prior_near (e.g. u0yaw13l) predate recovery_dwell,
  # the priors up to gtg_prior_spin (e.g. s507fzaf) predate stop_speed and
  # stop_angular_velocity (for those, set both to null in task_params), the
  # priors of gtg_prior_stop (e.g. w3nge2to) used 0.05 and 0.2.
  # Null trains a new prior in the run; set the id of a matching one to reuse it.
  wandb_id: null

training:
  # An environment step takes 0.02 seconds: 500000 steps are about 2.8 hours.
  num_timesteps: 500000
  action_repeat: 4

environment:
  task_params:
    # Leaving the arena is a violation and resets the robot. Without it the
    # robot can get lost outside of the range of the lidar.
    max_distance: 2.5
    # The buffer of R to leaving the arena, as in go_to_goal_recovery.
    recovery_max_distance: 2.2

agent:
  # For the SOMBRL baseline, add agent.recovery_threshold=-1e6.
  discounting: 0.95
  num_critic_updates_per_actor_update: 1
  optimism: 0.05
  # The task reward is the progress towards the goal, at most 0.12 per step.
  intervention_task_reward: -0.2
  critic_learning_rate: 1e-4
  min_alpha: 0.01
  recovery_threshold: 0.9
  # Matched to the disagreement of the learned model online, such that the
  # filter does not lock up. It was about 0.1 before stable_steering, which
  # lowers the disagreement of the model to about 0.35x (trained on the same
  # random-action data of the system, before and after).
  margin: 0.035
  penalty_scale: 0.2
  # Horizon and dwell of go_to_goal_recovery_prior.
  recovery_horizon: 35
  recovery_dwell: 10
  recovery_restart_rollouts: true
  # The most likely action of the prior, as reward_robustness.bootstrap_mode of
  # go_to_goal_recovery_prior. With a prior before gtg_prior_stop, set false.
  recovery_bootstrap_mode: true
  # Without the statistics of the prior, the model can get stuck at the start.
  init_normalizer_from_prior: true
  init_behavior_from_prior: false
