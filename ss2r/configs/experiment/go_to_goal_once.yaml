# @package _global_
defaults:
  - override /agent: once
  - override /environment: go_to_goal_cpu
  - _self_

prior:
  experiment: go_to_goal_recovery_prior
  # The last prior (fbhat9kt) was trained before stable_steering, on a robot
  # that ignores small steering commands. Null trains a new prior in the run;
  # set the id of one trained with stable_steering to reuse it.
  wandb_id: null

training:
  # An environment step takes 0.02 seconds: 500000 steps are about 2.8 hours.
  num_timesteps: 500000
  action_repeat: 4

environment:
  task_params:
    # Leaving the arena is a violation and resets the robot. Without it the
    # robot can get lost outside of the range of the lidar.
    max_distance: 2.5

agent:
  # For the SOMBRL baseline, add agent.recovery_threshold=-1e6.
  discounting: 0.95
  num_critic_updates_per_actor_update: 1
  optimism: 0.05
  # The task reward is the progress towards the goal, at most 0.12 per step.
  intervention_task_reward: -0.2
  critic_learning_rate: 1e-4
  min_alpha: 0.01
  recovery_threshold: 0.9
  # Matched to the disagreement of the learned model online, such that the
  # filter does not lock up. It was about 0.1 before stable_steering, which
  # lowers the disagreement of the model to about 0.35x (trained on the same
  # random-action data of the system, before and after).
  margin: 0.035
  penalty_scale: 0.2
  # Horizon of go_to_goal_recovery_prior.
  recovery_horizon: 25
  recovery_restart_rollouts: true
  # Without the statistics of the prior, the model can get stuck at the start.
  init_normalizer_from_prior: true
  init_behavior_from_prior: false
