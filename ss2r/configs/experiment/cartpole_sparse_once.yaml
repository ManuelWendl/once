# @package _global_
defaults:
  - cartpole_once
  - override /environment: cartpole_swingup_sparse_cpu
  - _self_

# Same as cartpole_once, with the sparse swing-up reward. The recovery prior
# does not use the task reward, the one of cartpole_once can be reused.
agent:
  # Exploration bonus on the task reward, needed to find the sparse reward.
  optimism: 0.5
