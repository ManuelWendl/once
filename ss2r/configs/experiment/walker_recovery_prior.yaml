# @package _global_
defaults:
  - mujoco_playground_dm_control
  - override /environment: walker_recovery
  - override /agent/propagation: spidr
  - override /agent/reward_robustness: pessimistic_recovery
  - _self_

training:
  num_timesteps: 8000000
  # Many environments in parallel, the fastest on a 4090 (with 8 perturbed
  # models per environment below).
  num_envs: 1024
  action_repeat: 1
  # Recovery horizon H = episode_length / action_repeat = 100 steps (2.5 s).
  episode_length: 100
  safe: false
  train_domain_randomization: true
  eval_domain_randomization: true
  render: false

agent:
  activation: swish
  # 8 per 128 environments, the update-to-data ratio of mujoco_playground_dm_control.
  grad_updates_per_step: 64
  # Finite horizon, no discounting.
  discounting: 1.0
  propagation:
    # Perturbed models per environment for the disagreement.
    num_envs: 8
    lambda_: 0.5
    alpha: 0.
    statistic: std
  reward_robustness:
    penalty_scale: 1.0
    margin: 0.01
